<!doctype html>
<!-- Profile cards. Rendered to ../*.png by render.sh: cards.html?c=<card>&t=<dark|light> -->
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
  :root { --bg: #1a1b26; --fg: #e6e1d6; --dim: #a9b1d6; --mute: #6b7089; --accent: #7aa2f7; --edge: #3b3f55; --shadow: rgba(0,0,0,.45); }
  .light { --bg: #f4f1ea; --fg: #1f2335; --dim: #4a5070; --mute: #8a8fa6; --accent: #3d59a1; --edge: #d6d0c2; --shadow: rgba(40,40,60,.18); }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  body { filter: drop-shadow(4px 6px 6px var(--shadow)); padding: 12px 16px 20px 12px; font: 400 16px "IBM Plex Sans", sans-serif; color: var(--fg); }
  .card { position: relative; background: var(--bg); border: 1.5px solid var(--edge);
          clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%); overflow: hidden; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .label { font: 600 11px "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
  h1 { font-weight: 600; font-size: 44px; letter-spacing: -.01em; }
  h2 { font-weight: 600; font-size: 22px; }
  p { color: var(--dim); }
  .accent { color: var(--accent); }

  #hero { width: 744px; height: 150px; padding: 26px 34px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  #hero p { font-size: 17px; }

  #syschange { width: 744px; height: 330px; display: flex; }
  #syschange img { width: 230px; height: 333px; object-fit: cover; object-position: top; border-right: 1.5px solid var(--edge); }
  #syschange .body { padding: 28px 30px; display: flex; flex-direction: column; gap: 10px; }
  #syschange p { font-size: 16px; line-height: 1.45; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .chip { font: 600 11px "JetBrains Mono", monospace; padding: 5px 9px; border: 1.5px solid var(--edge); color: var(--dim); }
  .chip.on { border-color: var(--accent); color: var(--accent); }

  .info { width: 744px; height: 172px; padding: 22px 30px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .info p { font-size: 15px; line-height: 1.45; }
  .info .chips { margin-top: 4px; }

  .group { width: 744px; height: 30px; display: flex; align-items: center; gap: 14px; }
  .group .label { color: var(--accent); }
  .group i { flex: 1; height: 1.5px; background: var(--edge); }

  #stack { width: 744px; height: 56px; padding: 0 22px; display: flex; align-items: center; gap: 18px; }
  #stack .mono { font-size: 13px; color: var(--dim); }

  #mail { width: 56px; height: 56px; display: grid; place-items: center; }
  #mail svg { width: 24px; height: 24px; stroke: var(--fg); fill: none; stroke-width: 1.8; }
</style>

<body>
<template id="t-hero">
  <div class="card" id="hero">
    <span class="label">dDan4a</span>
    <h1>Hi, I'm Daniil<span class="accent">.</span></h1>
    <p>Backend engineer. Go services for real-time traffic, and tools on top of LLM agents.</p>
  </div>
</template>

<template id="t-syschange">
  <div class="card" id="syschange">
    <img src="syschange-panel.png">
    <div class="body">
      <span class="label">Omarchy plugin · Go CLI</span>
      <h2>syschange</h2>
      <p>A history of changes to your Linux setup: config files, packages, services. A reason for each one, diff and undo.</p>
      <p>Your AI agents change your system — see what and why.</p>
      <div class="chips"><span class="chip on">✓ Omarchy marketplace · verified</span><span class="chip">Go CLI</span><span class="chip">QML plugin</span></div>
    </div>
  </div>
</template>

<template id="t-agent-skills">
  <div class="card info">
    <span class="label">Skills with evals</span><h2>agent-skills</h2>
    <p>Skills for Claude Code, Codex, Gemini CLI and others: writing Omarchy plugins, running parallel agent sessions in git worktrees.</p>
    <div class="chips"><span class="chip on">100% eval checks with the skill</span><span class="chip">55–64% without</span></div>
  </div>
</template>
<template id="t-tsukuyomi">
  <div class="card info">
    <span class="label">Go library</span><h2>tsukuyomi</h2>
    <p>Atomic status transitions for any domain entity: a transition graph with guards and hooks, plus compare-and-swap storage.</p>
    <div class="chips"><span class="chip">Postgres storage included</span></div>
  </div>
</template>

<template id="t-group-omarchy"><div class="group"><span class="label">Linux &amp; Omarchy</span><i></i></div></template>
<template id="t-group-agents"><div class="group"><span class="label">AI agents</span><i></i></div></template>
<template id="t-group-go"><div class="group"><span class="label">Go libraries</span><i></i></div></template>

<template id="t-stack">
  <div class="card" id="stack">
    <span class="label">Stack</span>
    <span class="mono">Go · gRPC · PostgreSQL · Centrifugo · Kubernetes · GitLab CI · Rust · Python</span>
  </div>
</template>

<template id="t-mail">
  <div class="card" id="mail"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3 7 9 6 9-6"/></svg></div>
</template>

<script>
  const q = new URLSearchParams(location.search);
  if (q.get("t") === "light") document.documentElement.className = "light";
  if (q.get("c").startsWith("group-")) document.body.style.filter = "none";
  document.body.append(document.getElementById("t-" + (q.get("c") || "hero")).content.cloneNode(true));
</script>
